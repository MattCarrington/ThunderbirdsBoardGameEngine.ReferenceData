name: Build (reusable)

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string

jobs:
  build:
    name: Build .NET Solution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore & Build
        run: |
          dotnet restore "${{ inputs.solution_file }}"
          dotnet build "${{ inputs.solution_file }}" --configuration Release --no-restore
