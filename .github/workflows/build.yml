name: Build (reusable)

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string

jobs:
  build:
    name: Build .NET Solution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore & Build
        run: |
          dotnet restore "${{ inputs.solution_file }}"
          dotnet build "${{ inputs.solution_file }}" --configuration Release --no-restore

      - name: Compile Reference Data snapshot
        working-directory: tools/Compiler
        run: dotnet run --configuration Release --no-build

      - name: Upload compiled snapshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: reference-data-snapshot
          path: tools/Compiler/snapshot.json
          if-no-files-found: error
