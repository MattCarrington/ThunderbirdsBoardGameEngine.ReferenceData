name: CI

on:
  pull_request:
  push:
    branches: ['**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: read
  packages: write

env:
  SOLUTION_FILE: &solution ThunderbirdsBoardGameEngine.ReferenceData.sln
    
jobs:
  ci-script-tests:
    uses: ./.github/workflows/tests-ci-scripts.yml

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
    with:
      solution_file: *solution

  build:
    uses: ./.github/workflows/build.yml
    with:
      solution_file: *solution
    needs:
      - static-analysis

  tests:
    uses: ./.github/workflows/tests-dotnet.yml
    with:
      solution_file: *solution
      run_component: true
    needs:
      - build

  packages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/package-release.yml
    with:
      before_sha: ${{ github.event.before }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets: inherit
    needs:
      - tests
      - ci-script-tests
