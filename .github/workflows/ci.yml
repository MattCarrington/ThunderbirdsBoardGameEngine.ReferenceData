name: CI

on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  packages: write

env:
  SOLUTION_FILE: &solution ThunderbirdsBoardGameEngine.ReferenceData.sln
    
jobs:
  ci-script-tests:
    uses: ./.github/workflows/tests-ci-scripts.yml

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml
    with:
      solution_file: *solution

  build:
    uses: ./.github/workflows/build.yml
    with:
      solution_file: *solution
    needs:
      - static-analysis

  tests:
    uses: ./.github/workflows/tests-dotnet.yml
    with:
      solution_file: *solution
      run_component: true
    needs:
      - build

  compute-version:
    if: github.event_name == 'push'
    uses: ./.github/workflows/version.yml
    with:
      pr_title: ${{ github.event.pull_request.title || github.event.head_commit.message }}
    needs:
      - tests
      - ci-script-tests

  tag-repo:
    if: github.ref == 'refs/heads/main' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/tag-repo.yml
    with:
      version: ${{ needs.compute-version.outputs.version }}
      tag_prefix: "server/v"
    needs:
      - compute-version

  packages:
    if: github.event_name == 'push' && needs.compute-version.outputs.release_type != 'none'
    uses: ./.github/workflows/package-release.yml
    with:
      before_sha: ${{ github.event.before }}
      default_branch: ${{ github.event.repository.default_branch }}
    secrets: inherit
    needs:
      - compute-version