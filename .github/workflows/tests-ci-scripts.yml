name: CI Script Tests (reusable)

on:
  workflow_call:

jobs:
  tests:
    name: Test CI Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run CI script tests
        shell: bash
        run: bash ./.github/scripts/run-tests.sh